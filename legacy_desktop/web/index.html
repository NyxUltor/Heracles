<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Heracles Mobile</title>
  <link rel="manifest" href="/web/manifest.json">
  <style>
    body{background:#0e0e0e;color:#fff;font-family:Segoe UI,system-ui,Arial;margin:0;padding:12px}
    header{display:flex;align-items:center;gap:8px}
    button{background:#111;border:1px solid #333;color:#0ff;padding:10px 14px;border-radius:8px}
    input{background:#1e1e1e;border:1px solid #333;color:#fff;padding:10px;border-radius:8px}
    .list{margin-top:12px}
    .row{background:#151515;border:1px solid #2a2a2a;padding:10px;border-radius:8px;margin-bottom:8px}
    .sessionTotal{font-size:20px;font-weight:800;color:#00ffcc;margin-top:10px}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  </style>
</head>
<body>
  <header>
    <button id="hamburger">☰</button>
    <h1 style="margin:0;font-size:20px">Heracles Mobile</h1>
  </header>

  <div style="margin-top:10px">
    <label for="exercise">Add exercise</label><br>
    <input id="exercise" placeholder="Type exercise name..." />
    <button id="add">Add</button>
  </div>

  <div class="list" id="exercises"></div>

  <div class="sessionTotal" id="sessionTotal">SESSION TOTAL: 0</div>

  <div class="footer">
    <div>
      <input id="duration" placeholder="Duration(minutes)" />
    </div>
    <div>
      <button id="save">Save Session</button>
    </div>
  </div>

<script src="/web/app.js"></script>
</body>
</html>
